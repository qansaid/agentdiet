blank_issues_enabled: false
contact_links:
  - name: Ask a question
    url: https://github.com/qansaid/agentdiet/discussions/categories/q-a
    about: Install problems, surprising numbers, CI wiring. Answers stay searchable and help the next person.
  - name: Propose an idea
    url: https://github.com/qansaid/agentdiet/discussions/categories/ideas
    about: A convention to detect or a check worth adding. Decide the shape here before code exists.
  - name: Show your grade
    url: https://github.com/qansaid/agentdiet/discussions/categories/show-and-tell
    about: Post the ALWAYS-ON line and the grade from your repository. Real numbers decide the roadmap.
  - name: How tokens are counted
    url: https://github.com/qansaid/agentdiet#how-tokens-are-counted
    about: The estimator is approximate on purpose. Read this before filing an accuracy bug.
  - name: Design notes and grades
    url: https://github.com/qansaid/agentdiet#grades
    about: The grade budgets are stated numbers, not percentages of the window.
