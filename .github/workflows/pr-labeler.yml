name: pull request labels

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Path based labels only. sync-labels stays false so a maintainer's manual
      # label survives a force-push that touches different files.
      - uses: actions/labeler@v7
        with:
          sync-labels: false
